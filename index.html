    authDomain: "unicornios-inestables.firebaseapp.com",
    databaseURL: "https://unicornios-inestables-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "unicornios-inestables",
    storageBucket: "unicornios-inestables.firebasestorage.app",
    messagingSenderId: "955258363437",
    appId: "1:955258363437:web:4f1422dc59155035cd22a4"
  };
  firebase.initializeApp(firebaseConfig);
  window.database = firebase.database();

  // Limpieza automática: borra salas y partidas con más de 10 min sin actividad
  function cleanOldRooms() {
    const cutoff = Date.now() - 10 * 60 * 1000; // 10 minutos
    window.database.ref('games').once('value').then(snap => {
      snap.forEach(child => {
        const game = child.val();
        if (game && game.lastUpdate && game.lastUpdate < cutoff) {
          const code = child.key;
          window.database.ref(`games/${code}`).remove();
          window.database.ref(`rooms/${code}`).remove();
          window.database.ref(`baby-selections/${code}`).remove();
        }
      });
    });
  }
  // Ejecutar al cargar y cada 2 minutos
  cleanOldRooms();
  setInterval(cleanOldRooms, 2 * 60 * 1000);
</script>

const shuffleArray = (array) => {
  const a = [...array];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

  if (!card) return null;

        className="card-zoom-image"
        onError={(e) => { e.target.src = `Imagenes2/${card.filename}.jpg`; }}
      />
    </div>
  );
}

  return (
    <div
      className={`${draggable ? 'card-draggable' : ''} ${className}`}
      onClick={onClick}
      draggable={draggable}
      onDragStart={(e) => {

          e.dataTransfer.setData('cardId', card.id);
          onDragStart(card);

        width: dims.w, height: dims.h, borderRadius: dims.r,
        overflow: 'hidden',

// ========== COMPONENTE PRINCIPAL ==========
function UnstableUnicornsGame() {
  const [gameState, setGameState] = useState('menu');
  const [roomCode, setRoomCode] = useState('');
  const [playerName, setPlayerName] = useState('');
  const [gameMode, setGameMode] = useState('ffa');
  const [numPlayers, setNumPlayers] = useState(4);
  const [currentRoom, setCurrentRoom] = useState(null);
  const [players, setPlayers] = useState([]);
  const [isHost, setIsHost] = useState(false);

  useEffect(() => {
    const interval = setInterval(() => {
      const sparkle = document.createElement('div');
      sparkle.className = 'sparkle';
      sparkle.style.left = Math.random() * window.innerWidth + 'px';
      sparkle.style.top = Math.random() * window.innerHeight + 'px';
      document.body.appendChild(sparkle);
      setTimeout(() => sparkle.remove(), 1000);
    }, 300);
    return () => clearInterval(interval);
  }, []);

  const generateRoomCode = () => Math.random().toString(36).substring(2, 8).toUpperCase();

  const createRoom = async () => {
    if (!playerName.trim()) { alert('Por favor ingresa tu nombre'); return; }
    const code = generateRoomCode();
    const room = {
      code,
      host: playerName,
      gameMode,
      numPlayers,
      players: [{ name: playerName, id: Date.now(), isHost: true }],
      state: 'waiting',
      createdAt: Date.now()
    };
    await window.database.ref(`rooms/${code}`).set(room);
    setRoomCode(code);
    setCurrentRoom(room);
    setIsHost(true);
    setPlayers(room.players);
    setGameState('lobby');
  };

  const joinRoom = async () => {
    if (!playerName.trim() || !roomCode.trim()) {
      alert('Por favor ingresa tu nombre y el código de sala');
      return;
    }
    const code = roomCode.toUpperCase();
    const snapshot = await window.database.ref(`rooms/${code}`).get();
    if (!snapshot.exists()) { alert('Sala no encontrada'); return; }
    const room = snapshot.val();
    // BUG FIX: players puede ser objeto en Firebase, convertir a array
    const playersArr = room.players ? Object.values(room.players) : [];
    if (playersArr.length >= room.numPlayers) { alert('La sala está llena'); return; }
    if (playersArr.some(p => p.name === playerName)) { alert('Ese nombre ya está en uso en esta sala'); return; }

    playersArr.push({ name: playerName, id: Date.now(), isHost: false });
    await window.database.ref(`rooms/${code}/players`).set(playersArr);
    setRoomCode(code);
    setCurrentRoom({ ...room, players: playersArr });
    setPlayers(playersArr);
    setGameState('lobby');
  };

  const startGame = async () => {
    if (!isHost) return;
    await window.database.ref(`rooms/${roomCode}/state`).set('baby-selection');
  };

  // BUG FIX: Listener de lobby con cleanup correcto, sin depender de gameState stale
  useEffect(() => {
    if (gameState !== 'lobby' || !roomCode) return;
    const roomRef = window.database.ref(`rooms/${roomCode}`);

    const handleRoomUpdate = (snapshot) => {
      if (!snapshot.exists()) return;
      const room = snapshot.val();
      const playersArr = room.players ? Object.values(room.players) : [];
      setPlayers(playersArr);
      setCurrentRoom({ ...room, players: playersArr });
      if (room.state === 'baby-selection') setGameState('baby-selection');
      if (room.state === 'playing') setGameState('playing');
    };

    roomRef.on('value', handleRoomUpdate);
    return () => roomRef.off('value', handleRoomUpdate);
  }, [gameState, roomCode]);

    <div style={{ height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px', overflow: 'auto' }}>
      <div style={{ background: 'rgba(255,255,255,0.95)', borderRadius: '20px', padding: '40px', maxWidth: '500px', width: '100%', boxShadow: '0 20px 60px rgba(0,0,0,0.3)' }}>
        <h1 className="rainbow-text" style={{ fontSize: '2.5rem', textAlign: 'center', marginBottom: '15px' }}>

        </h1>
        <div style={{ marginBottom: '20px' }}>

            type="text" value={playerName} onChange={(e) => setPlayerName(e.target.value)}

          />
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '20px' }}>
          <select value={gameMode} onChange={(e) => setGameMode(e.target.value)}

          </select>
          <select value={numPlayers} onChange={(e) => setNumPlayers(Number(e.target.value))}
            disabled={gameMode === '1v1'}

            {[2,3,4,5,6,7,8].map(n => <option key={n} value={n}>{n} jugadores</option>)}
          </select>

            Crear Sala

        <div style={{ textAlign: 'right', marginTop: '15px', fontSize: '0.75rem', color: '#bbb' }}>

        </div>

  if (gameState === 'join') return (
    <div style={{ height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px' }}>
      <div style={{ background: 'rgba(255,255,255,0.95)', borderRadius: '20px', padding: '40px', maxWidth: '500px', width: '100%', boxShadow: '0 20px 60px rgba(0,0,0,0.3)' }}>
        <h1 style={{ fontSize: '2rem', textAlign: 'center', marginBottom: '20px', color: '#667eea' }}>Unirse a Sala</h1>
        <div style={{ marginBottom: '15px' }}>
          <input
            type="text" value={playerName} onChange={(e) => setPlayerName(e.target.value)}
            placeholder="Tu nombre"
            style={{ width: '100%', padding: '12px', fontSize: '1rem', borderRadius: '8px', border: '2px solid #ddd', marginBottom: '10px' }}
          />
          <input
            type="text" value={roomCode} onChange={(e) => setRoomCode(e.target.value.toUpperCase())}

            style={{ width: '100%', padding: '15px', fontSize: '1.5rem', borderRadius: '10px', border: '2px solid #ddd', textAlign: 'center', letterSpacing: '5px', fontFamily: 'monospace', fontWeight: 'bold' }}

        <div style={{ display: 'flex', gap: '10px' }}>
          <button onClick={() => setGameState('menu')} style={{ flex: 1, padding: '15px', fontSize: '1.1rem', fontWeight: 'bold', background: '#95a5a6', color: 'white', border: 'none', borderRadius: '10px', cursor: 'pointer' }}>Volver</button>

        </div>
      </div>

  if (gameState === 'lobby') return (
    <div style={{ height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px', overflow: 'auto' }}>
      <div style={{ background: 'rgba(255,255,255,0.95)', borderRadius: '20px', padding: '30px', maxWidth: '700px', width: '100%', boxShadow: '0 20px 60px rgba(0,0,0,0.3)' }}>
        <div style={{ background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', borderRadius: '12px', padding: '20px', marginBottom: '20px', textAlign: 'center' }}>
          <div style={{ fontSize: '2rem', fontWeight: 'bold', color: 'white', letterSpacing: '5px', fontFamily: 'monospace' }}>{roomCode}</div>
        </div>
        <div style={{ background: '#f8f9fa', padding: '15px', borderRadius: '12px', marginBottom: '20px' }}>
          <h3 style={{ fontSize: '1.1rem', marginBottom: '10px', color: '#333' }}>

          <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>

              <div key={player.id} style={{ display: 'flex', alignItems: 'center', gap: '10px', padding: '10px', background: 'white', borderRadius: '8px' }}>
                <div style={{ width: '35px', height: '35px', borderRadius: '50%', background: `hsl(${index * 60}, 70%, 60%)`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1rem', fontWeight: 'bold', color: 'white' }}>

          <button onClick={startGame} disabled={players.length < 2} style={{ width: '100%', padding: '15px', fontSize: '1.2rem', fontWeight: 'bold', background: players.length >= 2 ? 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)' : '#ccc', color: 'white', border: 'none', borderRadius: '10px', cursor: players.length >= 2 ? 'pointer' : 'not-allowed' }}>

  if (gameState === 'playing') return (
    <GameBoard
      roomCode={roomCode}
      playerName={playerName}
      gameMode={currentRoom?.gameMode || 'ffa'}
      players={players}
      isHost={isHost}
      numPlayers={currentRoom?.numPlayers || players.length}
      onRematch={() => setGameState('baby-selection')}

  return null;

// ========== BABY SELECTION — 100% Firebase ==========
function BabySelection({ roomCode, playerName, players, isHost, onComplete }) {
  const [babySelections, setBabySelections] = useState({});
  const [mySelection, setMySelection] = useState(null);
  const [showModal, setShowModal] = useState(true);
  const babies = CARD_CATALOG.filter(c => c.type === 'baby');
  const onCompleteRef = useRef(onComplete);
  onCompleteRef.current = onComplete;

  // BUG FIX: Usar Firebase en tiempo real para sincronizar selecciones de bebés
  useEffect(() => {
    const ref = window.database.ref(`baby-selections/${roomCode}`);
    const handler = (snapshot) => {
      const data = snapshot.val() || {};
      setBabySelections(data);

      if (Object.keys(data).length === players.length) {
        if (isHost) {
          window.database.ref(`rooms/${roomCode}/state`).set('playing').then(() => {
            setTimeout(() => onCompleteRef.current(), 1500);
          });
        } else {
          setTimeout(() => onCompleteRef.current(), 1500);
        }
      }
    };
    ref.on('value', handler);
    return () => ref.off('value', handler);
  }, [roomCode, players.length, isHost]);

  const handleSelectBaby = (baby) => {
    setMySelection(baby);
    setShowModal(false);
    // BUG FIX: Guardar en Firebase, no localStorage
    window.database.ref(`baby-selections/${roomCode}/${playerName.replace(/[.#$[\]]/g, '_')}`).set(baby);
  };

  const allSelected = Object.keys(babySelections).length === players.length;

  return (
    <div style={{ height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px', overflow: 'auto' }}>
      {showModal && <BabySelectionModal babies={babies} playerName={playerName} onSelectBaby={handleSelectBaby} />}
      <div style={{ background: 'rgba(255,255,255,0.95)', borderRadius: '20px', padding: '30px', maxWidth: '800px', width: '100%', boxShadow: '0 20px 60px rgba(0,0,0,0.3)' }}>
        <h2 style={{ textAlign: 'center', color: '#667eea', fontSize: '1.8rem', marginBottom: '20px' }}>Selecciones de Bebés</h2>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: '15px', marginBottom: '20px' }}>
          {players.map((player) => {
            const key = player.name.replace(/[.#$[\]]/g, '_');
            const selection = babySelections[key];
            return (
              <div key={player.name} style={{ background: selection ? '#e8f5e9' : '#f8f9fa', padding: '15px', borderRadius: '10px', textAlign: 'center' }}>
                <strong style={{ fontSize: '0.9rem' }}>{player.name}</strong>
                {selection
                  ? <div style={{ marginTop: '10px' }}><Card card={selection} size="mini" /></div>
                  : <div style={{ color: '#999', marginTop: '10px' }}>⏳</div>
                }
              </div>
            );
          })}
        </div>
        {allSelected && (
          <div style={{ textAlign: 'center', padding: '15px', background: '#d4edda', borderRadius: '10px', color: '#155724', fontWeight: 'bold' }}>
            ✓ Iniciando partida...
          </div>
        )}
      </div>
    </div>
  );
}

// ========== GAME BOARD ==========
function GameBoard({ roomCode, playerName, gameMode, players, isHost, numPlayers, onRematch }) {
  const [gameData, setGameData] = useState(null);
  const [myHand, setMyHand] = useState([]);
  const [zoomedCard, setZoomedCard] = useState(null);
  const [message, setMessage] = useState('');
  const [draggedCard, setDraggedCard] = useState(null);
  const [dragSource, setDragSource] = useState(null);
  const [showDeckModal, setShowDeckModal] = useState(false);
  const [showDiscardModal, setShowDiscardModal] = useState(false);
  const [showGuarderiaModal, setShowGuarderiaModal] = useState(false);
  const [selectedCardAction, setSelectedCardAction] = useState(null);
  const [targetPlayer, setTargetPlayer] = useState(null);
  const [cardsToChooseFrom, setCardsToChooseFrom] = useState([]);
  const [expandedPlayerHand, setExpandedPlayerHand] = useState(null);
  const [winner, setWinner] = useState(null);

  // Lanzar confeti
  const launchConfetti = () => {
    const colors = ['#ff0080','#ff8c00','#40e0d0','#667eea','#27ae60','#e74c3c','#f39c12'];
    for (let i = 0; i < 80; i++) {
      setTimeout(() => {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = (1.5 + Math.random() * 2) + 's';
        piece.style.width = (6 + Math.random() * 8) + 'px';
        piece.style.height = (6 + Math.random() * 8) + 'px';
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 4000);
      }, i * 40);
    }
  };

  const showMessage = (msg) => {
    setMessage(msg);
    setTimeout(() => setMessage(''), 3000);
  };

  // BUG FIX: Un único listener en tiempo real, no polling con setInterval
  useEffect(() => {
    const ref = window.database.ref(`games/${roomCode}`);
    const handler = (snapshot) => {
      if (!snapshot.exists()) return;
      const game = snapshot.val();
      // Firebase convierte arrays a objetos; normalizar playerHands y stables
      if (game.playerHands) {
        Object.keys(game.playerHands).forEach(p => {
          if (!Array.isArray(game.playerHands[p])) {
            game.playerHands[p] = Object.values(game.playerHands[p]);
          }
        });
      }
      if (game.playerStables) {
        Object.keys(game.playerStables).forEach(p => {
          ['unicorns', 'upgrades', 'downgrades'].forEach(section => {
            if (game.playerStables[p][section] && !Array.isArray(game.playerStables[p][section])) {
              game.playerStables[p][section] = Object.values(game.playerStables[p][section]);
            }
            if (!game.playerStables[p][section]) game.playerStables[p][section] = [];
          });
        });
      }
      if (game.deck && !Array.isArray(game.deck)) game.deck = Object.values(game.deck);
      if (game.discard && !Array.isArray(game.discard)) game.discard = Object.values(game.discard);
      if (game.guarderia && !Array.isArray(game.guarderia)) game.guarderia = Object.values(game.guarderia);
      if (!game.deck) game.deck = [];
      if (!game.discard) game.discard = [];
      if (!game.guarderia) game.guarderia = [];

      setGameData(game);
      setMyHand(game.playerHands?.[playerName] || []);
      // Mostrar pantalla de victoria si otro jugador ganó
      if (game.winner && !winner) {
        setWinner(game.winner);
        launchConfetti();
      }
    };
    ref.on('value', handler);
    return () => ref.off('value', handler);
  }, [roomCode, playerName]);

  // Host inicializa la partida
  useEffect(() => {
    if (!isHost) return;
    const init = async () => {
      const snapshot = await window.database.ref(`games/${roomCode}`).get();
      if (snapshot.exists()) return; // ya inicializado

      const selSnapshot = await window.database.ref(`baby-selections/${roomCode}`).get();
      const babySelections = selSnapshot.val() || {};

      let deck = [];
      let guarderia = [];

      CARD_CATALOG.forEach(card => {
        if (gameMode === '1v1' && card.bannedIn1v1) return;
        for (let i = 0; i < card.quantity; i++) {
          const c = { ...card, id: `${card.filename}-${i}-${Date.now()}` };
          if (card.type === 'baby') {
            const isSelected = Object.values(babySelections).some(s => s.filename === card.filename);
            if (!isSelected) guarderia.push(c);
          } else {
            deck.push(c);
          }
        }
      });

      deck = shuffleArray(deck);
      guarderia = shuffleArray(guarderia);

      const playerHands = {};
      const playerStables = {};

      players.forEach(player => {
        playerHands[player.name] = deck.splice(0, 5);
        const keyName = player.name.replace(/[.#$[\]]/g, '_');
        const selectedBaby = babySelections[keyName];
        playerStables[player.name] = {
          unicorns: selectedBaby ? [{ ...selectedBaby, id: `baby-${player.name}` }] : [],
          upgrades: [],
          downgrades: []
        };
      });

      if (gameMode === '1v1') {
        players.forEach(player => {
          const neighCard = deck.find(c => c.type === 'instant');
          if (neighCard) {
            deck.splice(deck.indexOf(neighCard), 1);
            playerHands[player.name].push(neighCard);
          }
        });
      }

      const game = {
        deck, discard: [], guarderia, playerHands, playerStables,
        currentTurnIndex: 0,
        currentPlayer: players[0].name,
        unicornsToWin: numPlayers >= 6 ? 6 : 7,
        lastUpdate: Date.now()
      };

      await window.database.ref(`games/${roomCode}`).set(game);
    };
    init();
  }, [isHost]);

  const updateGame = (newGameData) => {
    newGameData.lastUpdate = Date.now();
    window.database.ref(`games/${roomCode}`).set(newGameData);
    // El listener en tiempo real actualizará el estado local automáticamente
  };

  const handleDragStart = (card, source) => {
    setDraggedCard(card);
    setDragSource(source);
  };
  const handleDragOver = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };

  const handleDrawCard = () => {
    if (!gameData || gameData.deck.length === 0) { showMessage('Mazo vacío'); return; }
    const newGameData = { ...gameData, deck: [...gameData.deck], playerHands: { ...gameData.playerHands, [playerName]: [...gameData.playerHands[playerName]] } };
    const drawnCard = newGameData.deck.shift();
    newGameData.playerHands[playerName].push(drawnCard);
    updateGame(newGameData);
    showMessage('Carta robada');
  };

  const handleEndTurn = () => {
    if (!gameData || gameData.currentPlayer !== playerName) { showMessage('No es tu turno'); return; }
    const hand = gameData.playerHands[playerName];
    if (hand.length > 7) { showMessage(`Descarta ${hand.length - 7} carta(s) primero`); return; }
    const newGameData = { ...gameData };
    newGameData.currentTurnIndex = (newGameData.currentTurnIndex + 1) % players.length;
    newGameData.currentPlayer = players[newGameData.currentTurnIndex].name;
    updateGame(newGameData);
    showMessage(`Turno de ${newGameData.currentPlayer}`);
  };

  const removeCardFromSource = (newGameData, source, cardId) => {
    let removed = null;
    if (source.type === 'hand') {
      const idx = newGameData.playerHands[playerName].findIndex(c => c.id === cardId);
      if (idx !== -1) removed = newGameData.playerHands[playerName].splice(idx, 1)[0];
    } else if (source.type === 'stable') {
      const arr = newGameData.playerStables[source.player][source.section];
      const idx = arr.findIndex(c => c.id === cardId);
      if (idx !== -1) removed = arr.splice(idx, 1)[0];
    } else if (source.type === 'discard') {
      const idx = newGameData.discard.findIndex(c => c.id === cardId);
      if (idx !== -1) removed = newGameData.discard.splice(idx, 1)[0];
    } else if (source.type === 'deck') {
      const idx = newGameData.deck.findIndex(c => c.id === cardId);
      if (idx !== -1) removed = newGameData.deck.splice(idx, 1)[0];
    } else if (source.type === 'guarderia') {
      const idx = newGameData.guarderia.findIndex(c => c.id === cardId);
      if (idx !== -1) removed = newGameData.guarderia.splice(idx, 1)[0];
    } else if (source.type === 'otherHand') {
      removed = newGameData.playerHands[source.player].splice(source.index, 1)[0];
    }
    return removed;
  };

  const deepCopyGame = (g) => JSON.parse(JSON.stringify(g));

  const handleDropOnDiscard = (e) => {
    e.preventDefault();
    if (!draggedCard || !dragSource) return;
    const newGameData = deepCopyGame(gameData);
    const removed = removeCardFromSource(newGameData, dragSource, draggedCard.id);
    if (removed) { newGameData.discard.push(removed); updateGame(newGameData); showMessage(`${removed.name} descartada`); }
    setDraggedCard(null); setDragSource(null);
  };

  const handleDropOnGuarderia = (e) => {
    e.preventDefault();
    if (!draggedCard || !dragSource) return;
    if (draggedCard.type !== 'baby') { showMessage('Solo los bebés pueden ir a la guardería'); setDraggedCard(null); setDragSource(null); return; }
    const newGameData = deepCopyGame(gameData);
    const removed = removeCardFromSource(newGameData, dragSource, draggedCard.id);
    if (removed) { newGameData.guarderia.push(removed); updateGame(newGameData); showMessage(`${removed.name} enviado a la guardería`); }
    setDraggedCard(null); setDragSource(null);
  };

  const handleDropOnStable = (e, targetP) => {
    e.preventDefault();
    if (!draggedCard || !dragSource) return;
    const newGameData = deepCopyGame(gameData);
    const removed = removeCardFromSource(newGameData, dragSource, draggedCard.id);
    if (removed) {
      const stable = newGameData.playerStables[targetP];
      if (removed.type === 'baby' || removed.type === 'basic' || removed.type === 'magic') {
        stable.unicorns.push(removed);
        if (stable.unicorns.length >= newGameData.unicornsToWin) {
          newGameData.winner = targetP;
          setWinner(targetP);
          launchConfetti();
        }
      } else if (removed.type === 'upgrade') {
        stable.upgrades.push(removed);
      } else if (removed.type === 'downgrade') {
        stable.downgrades.push(removed);
      } else {
        newGameData.discard.push(removed);
      }
      updateGame(newGameData);
      showMessage(`${removed.name} jugada en establo de ${targetP}`);
    }
    setDraggedCard(null); setDragSource(null);
  };

  const handleDropOnHand = (e) => {
    e.preventDefault();
    if (!draggedCard || !dragSource || dragSource.type === 'hand') return;
    const newGameData = deepCopyGame(gameData);
    const removed = removeCardFromSource(newGameData, dragSource, draggedCard.id);
    if (removed) { newGameData.playerHands[playerName].push(removed); updateGame(newGameData); showMessage(`${removed.name} a tu mano`); }
    setDraggedCard(null); setDragSource(null);
  };

  const handleDropOnOtherHand = (e, targetP) => {
    e.preventDefault();
    if (!draggedCard || dragSource?.type !== 'hand') return;
    const newGameData = deepCopyGame(gameData);
    const removed = removeCardFromSource(newGameData, dragSource, draggedCard.id);
    if (removed) { newGameData.playerHands[targetP].push(removed); updateGame(newGameData); showMessage(`${removed.name} dada a ${targetP}`); }
    setDraggedCard(null); setDragSource(null);
  };

  const handleShuffleDiscardIntoDeck = () => {
    if (!gameData || gameData.discard.length === 0) { showMessage('No hay cartas para barajar'); return; }
    const newGameData = deepCopyGame(gameData);
    newGameData.deck = shuffleArray([...newGameData.deck, ...newGameData.discard]);
    newGameData.discard = [];
    updateGame(newGameData);
    showMessage('Descartes mezclados en el mazo');
  };

  const handleShuffleDeck = () => {
    if (!gameData || gameData.deck.length === 0) { showMessage('El mazo está vacío'); return; }
    const newGameData = deepCopyGame(gameData);
    newGameData.deck = shuffleArray(newGameData.deck);
    updateGame(newGameData);
    showMessage('Mazo barajado');
  };

  const handleSelectFromDeck = (card) => {
    const newGameData = deepCopyGame(gameData);
    const idx = newGameData.deck.findIndex(c => c.id === card.id);
    if (idx !== -1) {
      const removed = newGameData.deck.splice(idx, 1)[0];
      newGameData.playerHands[playerName].push(removed);
      updateGame(newGameData);
      showMessage(`${removed.name} agregada a tu mano`);
    }
    setShowDeckModal(false);
  };

  const handleSelectFromDiscard = (card) => {
    const newGameData = deepCopyGame(gameData);
    const idx = newGameData.discard.findIndex(c => c.id === card.id);
    if (idx !== -1) {
      const removed = newGameData.discard.splice(idx, 1)[0];
      newGameData.playerHands[playerName].push(removed);
      updateGame(newGameData);
      showMessage(`${removed.name} recuperada de descartes`);
    }
    setShowDiscardModal(false);
  };

  const handleSelectFromGuarderia = (card) => {
    const newGameData = deepCopyGame(gameData);
    const idx = newGameData.guarderia.findIndex(c => c.id === card.id);
    if (idx !== -1) {
      const removed = newGameData.guarderia.splice(idx, 1)[0];
      newGameData.playerHands[playerName].push(removed);
      updateGame(newGameData);
      showMessage(`${removed.name} recuperada de la guardería`);
    }
    setShowGuarderiaModal(false);
  };

  const hasNannyCam = (pName) => {
    const stable = gameData?.playerStables?.[pName];
    return stable?.downgrades?.some(c => c.filename === '0022') || false;
  };

  const handleRematch = async () => {
    await window.database.ref(`games/${roomCode}`).remove();
    await window.database.ref(`baby-selections/${roomCode}`).remove();
    await window.database.ref(`rooms/${roomCode}/state`).set('baby-selection');
    setWinner(null);
    setGameData(null);
    setMyHand([]);
    if (onRematch) onRematch();
  };

  // Escuchar cambios de estado de sala (para no-host detectar revancha)
  useEffect(() => {
    const ref = window.database.ref(`rooms/${roomCode}/state`);
    const handler = (snap) => {
      if (snap.val() === 'baby-selection' && winner) {
        setWinner(null);
        setGameData(null);
        setMyHand([]);
        if (onRematch) onRematch();
      }
    };
    ref.on('value', handler);
    return () => ref.off('value', handler);
  }, [roomCode, winner]);

  if (!gameData && !winner) return (
    <div style={{ height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontSize: '1.5rem' }}>
      Iniciando...
    </div>
  );

  if (!gameData) return null; // winner screen handled below

  const isMyTurn = gameData.currentPlayer === playerName;
  const myStable = gameData.playerStables?.[playerName] || { unicorns: [], upgrades: [], downgrades: [] };

  return (
    <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
      {zoomedCard && <CardZoom card={zoomedCard} onClose={() => setZoomedCard(null)} />}

      {/* Pantalla de victoria */}
      {winner && (
        <div className="winner-overlay">
          <div className="winner-content">
            <div style={{ fontSize: '4rem', marginBottom: '10px' }}>🏆</div>
            <h1 className="rainbow-text" style={{ fontSize: '2.2rem', marginBottom: '10px' }}>
              ¡{winner} ha ganado!
            </h1>
            <p style={{ color: '#666', fontSize: '1.1rem', marginBottom: '30px' }}>
              {winner === playerName ? '¡Eres el campeón de los unicornios! 🦄' : `Mejor suerte la próxima vez 😅`}
            </p>
            <div style={{ display: 'flex', gap: '15px', justifyContent: 'center', flexWrap: 'wrap' }}>
              {isHost && (
                <button onClick={handleRematch} style={{ padding: '15px 35px', fontSize: '1.1rem', fontWeight: 'bold', background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', color: 'white', border: 'none', borderRadius: '12px', cursor: 'pointer', boxShadow: '0 4px 15px rgba(102,126,234,0.4)' }}>
                  🔄 Revancha
                </button>
              )}
              {!isHost && (
                <p style={{ color: '#999', fontSize: '0.9rem' }}>Esperando que el host inicie la revancha...</p>
              )}
              <button onClick={() => window.location.reload()} style={{ padding: '15px 35px', fontSize: '1.1rem', fontWeight: 'bold', background: '#95a5a6', color: 'white', border: 'none', borderRadius: '12px', cursor: 'pointer' }}>
                🚪 Salir
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Modal acción de carta especial */}
      {selectedCardAction && (
        <div className="modal-overlay" onClick={() => setSelectedCardAction(null)}>
          <div className="modal-content" onClick={e => e.stopPropagation()}>
            <h2 style={{ color: '#667eea', textAlign: 'center' }}>
              {selectedCardAction === 'robo_descarado' ? 'Robo Descarado' : 'Trato Injusto'}
            </h2>
            <p style={{ textAlign: 'center', color: '#666', margin: '10px 0 20px' }}>
              {selectedCardAction === 'robo_descarado'
                ? 'Elige un jugador para robar una carta de su mano'
                : 'Elige un jugador para intercambiar manos'}
            </p>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(150px, 1fr))', gap: '15px', marginTop: '20px' }}>
              {players.filter(p => p.name !== playerName).map(player => (
                <div
                  key={player.name}
                  onClick={() => {
                    if (selectedCardAction === 'robo_descarado') {
                      setTargetPlayer(player.name);
                      setCardsToChooseFrom([...(gameData.playerHands[player.name] || [])]);
                      setSelectedCardAction(null);
                    } else {
                      const newGameData = deepCopyGame(gameData);
                      const cardIdx = newGameData.playerHands[playerName].findIndex(c => c.filename === '0050');
                      let tratoCard = null;
                      if (cardIdx !== -1) tratoCard = newGameData.playerHands[playerName].splice(cardIdx, 1)[0];
                      const myHandCopy = [...newGameData.playerHands[playerName]];
                      const theirHandCopy = [...(newGameData.playerHands[player.name] || [])];
                      newGameData.playerHands[playerName] = theirHandCopy;
                      newGameData.playerHands[player.name] = myHandCopy;
                      if (tratoCard) newGameData.discard.push(tratoCard);
                      updateGame(newGameData);
                      setSelectedCardAction(null);
                      showMessage(`Manos intercambiadas con ${player.name}`);
                    }
                  }}
                  style={{ padding: '15px', background: '#f8f9fa', borderRadius: '10px', textAlign: 'center', cursor: 'pointer', border: '2px solid #e0e0e0' }}
                >
                  <div style={{ width: '50px', height: '50px', borderRadius: '50%', background: `hsl(${players.findIndex(p => p.name === player.name) * 60}, 70%, 60%)`, display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 10px', color: 'white', fontWeight: 'bold', fontSize: '1.2rem' }}>
                    {player.name[0].toUpperCase()}
                  </div>
                  <strong>{player.name}</strong>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* Modal selección carta de otro jugador */}
      {targetPlayer && cardsToChooseFrom.length > 0 && (
        <div className="modal-overlay" onClick={() => { setTargetPlayer(null); setCardsToChooseFrom([]); }}>
          <div className="modal-content" onClick={e => e.stopPropagation()}>
            <h2 style={{ color: '#667eea', textAlign: 'center' }}>Elige una carta de {targetPlayer}</h2>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(140px, 1fr))', gap: '15px', marginTop: '20px' }}>
              {cardsToChooseFrom.map((card, index) => (
                <div key={`${card.id}-${index}`} onClick={() => {
                  const newGameData = deepCopyGame(gameData);
                  const idx = newGameData.playerHands[targetPlayer].findIndex(c => c.id === card.id);
                  if (idx !== -1) {
                    const stolen = newGameData.playerHands[targetPlayer].splice(idx, 1)[0];
                    newGameData.playerHands[playerName].push(stolen);
                    const roboIdx = newGameData.playerHands[playerName].findIndex(c => c.filename === '0046');
                    if (roboIdx !== -1) newGameData.discard.push(newGameData.playerHands[playerName].splice(roboIdx, 1)[0]);
                    updateGame(newGameData);
                    setTargetPlayer(null); setCardsToChooseFrom([]);
                    showMessage(`Has robado ${stolen.name} a ${targetPlayer}`);
                  }
                }} style={{ cursor: 'pointer' }}>
                  <Card card={card} size="small" />
                  <div style={{ textAlign: 'center', fontSize: '0.8rem', marginTop: '5px' }}>{card.name}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {showDeckModal && <CardListModal title="🎴 Mazo de Robo" cards={gameData.deck} onClose={() => setShowDeckModal(false)} onSelectCard={handleSelectFromDeck} allowDrag={true} />}
      {showDiscardModal && <CardListModal title="🗑️ Pila de Descartes" cards={[...gameData.discard].reverse()} onClose={() => setShowDiscardModal(false)} onSelectCard={handleSelectFromDiscard} allowDrag={true} />}
      {showGuarderiaModal && <CardListModal title="🍼 Guardería de Bebés" cards={gameData.guarderia} onClose={() => setShowGuarderiaModal(false)} onSelectCard={handleSelectFromGuarderia} allowDrag={true} />}

      {message && (
        <div style={{ position: 'fixed', top: '10px', left: '50%', transform: 'translateX(-50%)', background: 'rgba(0,0,0,0.9)', color: 'white', padding: '12px 25px', borderRadius: '8px', fontSize: '1rem', zIndex: 9998, boxShadow: '0 4px 20px rgba(0,0,0,0.3)' }}>
          {message}
        </div>
      )}

      {/* Header */}
      <div style={{ background: 'rgba(255,255,255,0.95)', padding: '10px 20px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexShrink: 0 }}>
        <div style={{ fontSize: '0.9rem' }}>
          <strong style={{ color: '#667eea' }}>Sala:</strong> {roomCode} |
          <strong style={{ color: isMyTurn ? '#27ae60' : '#666', marginLeft: '10px' }}>Turno: {gameData.currentPlayer}</strong>
          {isMyTurn && <span style={{ color: '#27ae60' }}> (TÚ)</span>}
        </div>
        <div style={{ fontSize: '0.9rem', color: '#666' }}>Ganar con: {gameData.unicornsToWin} 🦄</div>
      </div>

      {/* Área principal */}
      <div style={{ flex: 1, display: 'grid', gridTemplateRows: 'auto 1fr auto', gap: '10px', padding: '10px', overflow: 'hidden' }}>

        {/* Fila superior: Mazo, Descartes, Guardería, Establos */}
        <div style={{ display: 'grid', gridTemplateColumns: '180px 180px 180px 1fr', gap: '10px', alignItems: 'start' }}>
          {/* Mazo */}
          <div style={{ textAlign: 'center' }}>
            <div onClick={handleDrawCard} style={{ width: '140px', height: '196px', background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', borderRadius: '12px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', boxShadow: '0 4px 15px rgba(0,0,0,0.3)', border: '3px solid white', margin: '0 auto' }}>
              <div style={{ fontSize: '3rem' }}>🎴</div>
              <div style={{ color: 'white', fontWeight: 'bold', fontSize: '1.2rem' }}>{gameData.deck.length}</div>
            </div>
            <button onClick={() => setShowDeckModal(true)} style={{ marginTop: '8px', padding: '6px 12px', fontSize: '0.75rem', background: '#667eea', color: 'white', border: 'none', borderRadius: '6px', cursor: 'pointer', display: 'block', width: '100%' }}>Ver Mazo</button>
            <button onClick={handleShuffleDeck} disabled={gameData.deck.length === 0} style={{ marginTop: '5px', padding: '6px 12px', fontSize: '0.75rem', background: gameData.deck.length > 0 ? '#9b59b6' : '#ccc', color: 'white', border: 'none', borderRadius: '6px', cursor: gameData.deck.length > 0 ? 'pointer' : 'not-allowed', display: 'block', width: '100%' }}>🔀 Barajar</button>
          </div>

          {/* Descartes */}
          <div style={{ textAlign: 'center' }}>
            <div className={`drop-zone ${draggedCard ? 'drop-zone-active' : ''}`} onDragOver={handleDragOver} onDrop={handleDropOnDiscard} onClick={() => setShowDiscardModal(true)} style={{ width: '140px', height: '196px', background: gameData.discard.length > 0 ? 'white' : '#f5f5f5', borderRadius: '12px', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', boxShadow: '0 4px 15px rgba(0,0,0,0.3)', border: '3px solid #e0e0e0', overflow: 'hidden', position: 'relative', margin: '0 auto' }}>
              {gameData.discard.length > 0
                ? <img src={`Imagenes1/${gameData.discard[gameData.discard.length-1].filename}.jpg`} alt="Última descartada" style={{ width: '100%', height: '100%', objectFit: 'cover' }} onError={(e) => { e.target.src = `Imagenes2/${gameData.discard[gameData.discard.length-1].filename}.jpg`; }} />
                : <div style={{ fontSize: '3rem' }}>🗑️</div>
              }
              <div style={{ position: 'absolute', bottom: '5px', right: '5px', background: 'rgba(0,0,0,0.7)', color: 'white', padding: '3px 8px', borderRadius: '5px', fontSize: '0.8rem', fontWeight: 'bold' }}>{gameData.discard.length}</div>
            </div>
            <button onClick={handleShuffleDiscardIntoDeck} disabled={gameData.discard.length === 0} style={{ marginTop: '8px', padding: '6px 12px', fontSize: '0.75rem', background: gameData.discard.length > 0 ? '#e74c3c' : '#ccc', color: 'white', border: 'none', borderRadius: '6px', cursor: gameData.discard.length > 0 ? 'pointer' : 'not-allowed' }}>Barajar al mazo</button>
          </div>

          {/* Guardería */}
          <div style={{ textAlign: 'center' }}>
            <div className={`drop-zone ${draggedCard && draggedCard.type === 'baby' ? 'drop-zone-active' : ''}`} onDragOver={handleDragOver} onDrop={handleDropOnGuarderia} onClick={() => setShowGuarderiaModal(true)} style={{ width: '140px', height: '196px', background: gameData.guarderia.length > 0 ? 'white' : '#f5f5f5', borderRadius: '12px', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', boxShadow: '0 4px 15px rgba(0,0,0,0.3)', border: '3px solid #9B59B6', overflow: 'hidden', position: 'relative', margin: '0 auto' }}>
              {gameData.guarderia.length > 0
                ? <img src={`Imagenes1/${gameData.guarderia[gameData.guarderia.length-1].filename}.jpg`} alt="Guardería" style={{ width: '100%', height: '100%', objectFit: 'cover' }} onError={(e) => { e.target.src = `Imagenes2/${gameData.guarderia[gameData.guarderia.length-1].filename}.jpg`; }} />
                : <div style={{ fontSize: '3rem' }}>🍼</div>
              }
              <div style={{ position: 'absolute', bottom: '5px', right: '5px', background: 'rgba(155,89,182,0.9)', color: 'white', padding: '3px 8px', borderRadius: '5px', fontSize: '0.8rem', fontWeight: 'bold' }}>{gameData.guarderia.length}</div>
            </div>
            <button onClick={() => setShowGuarderiaModal(true)} disabled={gameData.guarderia.length === 0} style={{ marginTop: '8px', padding: '6px 12px', fontSize: '0.75rem', background: gameData.guarderia.length > 0 ? '#9B59B6' : '#ccc', color: 'white', border: 'none', borderRadius: '6px', cursor: gameData.guarderia.length > 0 ? 'pointer' : 'not-allowed' }}>Ver Guardería</button>
          </div>

          {/* Establos otros jugadores */}
          <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap', alignContent: 'start' }}>
            {players.filter(p => p.name !== playerName).map((player) => {
              const stable = gameData.playerStables?.[player.name] || { unicorns: [], upgrades: [], downgrades: [] };
              const unicornCount = stable.unicorns.length;
              const isWinner = unicornCount >= gameData.unicornsToWin;
              return (
                <div key={player.name} className={`drop-zone ${draggedCard ? 'drop-zone-active' : ''}`} onDragOver={handleDragOver} onDrop={(e) => handleDropOnStable(e, player.name)} style={{ background: isWinner ? '#d4edda' : '#f8f9fa', padding: '10px', borderRadius: '8px', border: '2px solid #e0e0e0', minWidth: '200px', maxWidth: '250px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '8px' }}>
                    <div style={{ width: '28px', height: '28px', borderRadius: '50%', background: `hsl(${players.findIndex(p => p.name === player.name) * 60}, 70%, 60%)`, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontWeight: 'bold', fontSize: '0.9rem' }}>
                      {player.name[0].toUpperCase()}
                    </div>
                    <strong style={{ fontSize: '0.85rem' }}>{player.name}</strong>
                    {isWinner && <span>🏆</span>}
                  </div>
                  <div style={{ fontSize: '0.85rem', marginBottom: '6px' }}>
                    🦄 {unicornCount}/{gameData.unicornsToWin} | ✋ {gameData.playerHands?.[player.name]?.length || 0}
                  </div>
                  {stable.unicorns.length > 0 && (
                    <div style={{ marginBottom: '6px' }}>
                      <div style={{ fontSize: '0.7rem', color: '#666', marginBottom: '3px' }}>Unicornios:</div>
                      <div style={{ display: 'flex', gap: '3px', flexWrap: 'wrap' }}>
                        {stable.unicorns.map((u, idx) => (
                          <Card key={`${u.id}-${idx}`} card={u} size="mini" onClick={() => setZoomedCard(u)} draggable onDragStart={() => handleDragStart(u, { type: 'stable', player: player.name, section: 'unicorns' })} className={draggedCard?.id === u.id ? 'card-dragging' : ''} />
                        ))}
                      </div>
                    </div>
                  )}
                  {stable.upgrades.length > 0 && (
                    <div style={{ marginBottom: '6px' }}>
                      <div style={{ fontSize: '0.7rem', color: '#666', marginBottom: '3px' }}>Ventajas:</div>
                      <div style={{ display: 'flex', gap: '3px', flexWrap: 'wrap' }}>
                        {stable.upgrades.map((u, idx) => (
                          <Card key={`${u.id}-${idx}`} card={u} size="mini" onClick={() => setZoomedCard(u)} draggable onDragStart={() => handleDragStart(u, { type: 'stable', player: player.name, section: 'upgrades' })} className={draggedCard?.id === u.id ? 'card-dragging' : ''} />
                        ))}
                      </div>
                    </div>
                  )}
                  {stable.downgrades.length > 0 && (
                    <div style={{ marginBottom: '6px' }}>
                      <div style={{ fontSize: '0.7rem', color: '#666', marginBottom: '3px' }}>Desventajas:</div>
                      <div style={{ display: 'flex', gap: '3px', flexWrap: 'wrap' }}>
                        {stable.downgrades.map((d, idx) => (
                          <Card key={`${d.id}-${idx}`} card={d} size="mini" onClick={() => setZoomedCard(d)} draggable onDragStart={() => handleDragStart(d, { type: 'stable', player: player.name, section: 'downgrades' })} className={draggedCard?.id === d.id ? 'card-dragging' : ''} />
                        ))}
                      </div>
                    </div>
                  )}
                  {/* Mano del otro jugador */}
                  {gameData.playerHands?.[player.name]?.length > 0 && (
                    <div className={`drop-zone ${draggedCard && dragSource?.type === 'hand' ? 'drop-zone-active' : ''}`} onDragOver={handleDragOver} onDrop={(e) => handleDropOnOtherHand(e, player.name)} style={{ marginTop: '8px', padding: '6px', background: 'rgba(255,255,255,0.5)', borderRadius: '6px', border: '2px dashed #999' }}>
                      <div style={{ fontSize: '0.7rem', color: '#666', marginBottom: '3px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <span>Mano ({gameData.playerHands[player.name].length}):</span>
                        <button onClick={() => setExpandedPlayerHand(expandedPlayerHand === player.name ? null : player.name)} style={{ padding: '2px 6px', fontSize: '0.7rem', background: '#667eea', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer' }}>
                          {expandedPlayerHand === player.name ? '▼' : '▶'}
                        </button>
                      </div>
                      <div style={{ display: 'flex', gap: '3px', flexWrap: 'wrap', maxHeight: expandedPlayerHand === player.name ? 'none' : '45px', overflow: expandedPlayerHand === player.name ? 'visible' : 'hidden' }}>
                        {hasNannyCam(player.name)
                          ? gameData.playerHands[player.name].map((card, idx) => (
                              <Card key={`hand-${player.name}-${idx}`} card={card} size="mini" onClick={() => setZoomedCard(card)} draggable onDragStart={() => { setDraggedCard(card); setDragSource({ type: 'otherHand', player: player.name, index: idx }); }} className={dragSource?.type === 'otherHand' && dragSource?.player === player.name && dragSource?.index === idx ? 'card-dragging' : ''} />
                            ))
                          : gameData.playerHands[player.name].map((_, idx) => (
                              <CardBack key={`hand-${player.name}-${idx}`} size="mini" draggable onDragStart={() => { const card = gameData.playerHands[player.name][idx]; setDraggedCard(card); setDragSource({ type: 'otherHand', player: player.name, index: idx }); }} className={dragSource?.type === 'otherHand' && dragSource?.player === player.name && dragSource?.index === idx ? 'card-dragging' : ''} />
                            ))
                        }
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>

        {/* Tu establo */}
        <div className={`drop-zone ${draggedCard ? 'drop-zone-active' : ''}`} onDragOver={handleDragOver} onDrop={(e) => handleDropOnStable(e, playerName)} style={{ background: 'rgba(255,255,255,0.95)', borderRadius: '12px', padding: '15px', border: '3px solid #667eea', overflow: 'auto' }}>
          <h3 style={{ marginBottom: '10px', color: '#667eea', fontSize: '1.1rem' }}>🏰 TU ESTABLO</h3>
          <div style={{ display: 'flex', gap: '15px', flexWrap: 'wrap' }}>
            {myStable.unicorns.length > 0 && (
              <div style={{ flex: '1 1 300px' }}>
                <h4 style={{ fontSize: '0.9rem', marginBottom: '8px', color: '#333' }}>🦄 Unicornios ({myStable.unicorns.length}/{gameData.unicornsToWin}):</h4>
                <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                  {myStable.unicorns.map((u, idx) => (
                    <Card key={`${u.id}-${idx}`} card={u} size="small" onClick={() => setZoomedCard(u)} draggable onDragStart={() => handleDragStart(u, { type: 'stable', player: playerName, section: 'unicorns' })} className={draggedCard?.id === u.id ? 'card-dragging' : ''} />
                  ))}
                </div>
              </div>
            )}
            {myStable.upgrades.length > 0 && (
              <div style={{ flex: '1 1 200px' }}>
                <h4 style={{ fontSize: '0.9rem', marginBottom: '8px', color: '#333' }}>↑ Ventajas ({myStable.upgrades.length}):</h4>
                <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                  {myStable.upgrades.map((u, idx) => (
                    <Card key={`${u.id}-${idx}`} card={u} size="small" onClick={() => setZoomedCard(u)} draggable onDragStart={() => handleDragStart(u, { type: 'stable', player: playerName, section: 'upgrades' })} className={draggedCard?.id === u.id ? 'card-dragging' : ''} />
                  ))}
                </div>
              </div>
            )}
            {myStable.downgrades.length > 0 && (
              <div style={{ flex: '1 1 200px' }}>
                <h4 style={{ fontSize: '0.9rem', marginBottom: '8px', color: '#333' }}>↓ Desventajas ({myStable.downgrades.length}):</h4>
                <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                  {myStable.downgrades.map((d, idx) => (
                    <Card key={`${d.id}-${idx}`} card={d} size="small" onClick={() => setZoomedCard(d)} draggable onDragStart={() => handleDragStart(d, { type: 'stable', player: playerName, section: 'downgrades' })} className={draggedCard?.id === d.id ? 'card-dragging' : ''} />
                  ))}
                </div>
              </div>
            )}
            {myStable.unicorns.length === 0 && myStable.upgrades.length === 0 && myStable.downgrades.length === 0 && (
              <div style={{ width: '100%', textAlign: 'center', padding: '30px', color: '#999' }}>Arrastra cartas aquí</div>
            )}
          </div>
        </div>

        {/* Tu mano */}
        <div className={`drop-zone ${draggedCard && dragSource?.type !== 'hand' ? 'drop-zone-active' : ''} ${myHand.length > 7 ? 'hand-over-limit' : ''}`} onDragOver={handleDragOver} onDrop={handleDropOnHand} style={{ background: 'rgba(255,255,255,0.95)', borderRadius: '12px', padding: '15px', border: `3px solid ${myHand.length > 7 ? '#e74c3c' : '#27ae60'}` }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
            <h3 style={{ color: myHand.length > 7 ? '#e74c3c' : '#27ae60', fontSize: '1.1rem' }}>
              ✋ TU MANO ({myHand.length}/7)
              {myHand.length > 7 && (
                <span style={{ marginLeft: '10px', fontSize: '0.85rem', background: '#e74c3c', color: 'white', padding: '2px 10px', borderRadius: '20px', fontWeight: 'bold' }}>
                  ⚠️ Descarta {myHand.length - 7}
                </span>
              )}
            </h3>
            <button onClick={handleEndTurn} disabled={!isMyTurn} style={{ padding: '10px 20px', fontSize: '1rem', fontWeight: 'bold', background: isMyTurn ? 'linear-gradient(135deg, #e74c3c 0%, #c0392b 100%)' : '#ccc', color: 'white', border: 'none', borderRadius: '8px', cursor: isMyTurn ? 'pointer' : 'not-allowed' }}>
              {isMyTurn ? '⏭️ Terminar Turno' : '⏳ Espera'}
            </button>
          </div>
          {myHand.length > 0 ? (
            <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap', justifyContent: 'center' }}>
              {myHand.map((card, index) => (
                <div key={`${card.id}-${index}`} style={{ position: 'relative' }}>
                  <Card card={card} draggable onDragStart={() => handleDragStart(card, { type: 'hand' })} className={draggedCard?.id === card.id ? 'card-dragging' : ''} onClick={() => setZoomedCard(card)} />
                  {isMyTurn && (card.filename === '0046' || card.filename === '0050') && (
                    <button onClick={(e) => {
                      e.stopPropagation();
                      if (card.filename === '0046') setSelectedCardAction('robo_descarado');
                      if (card.filename === '0050') setSelectedCardAction('trato_injusto');
                    }} style={{ position: 'absolute', bottom: '5px', left: '50%', transform: 'translateX(-50%)', padding: '3px 10px', fontSize: '0.6rem', background: '#e74c3c', color: 'white', border: 'none', borderRadius: '15px', cursor: 'pointer', zIndex: 10, whiteSpace: 'nowrap' }}>
                      Usar
                    </button>
                  )}
                </div>
              ))}
            </div>
          ) : (
            <div style={{ textAlign: 'center', padding: '20px', color: '#999' }}>Sin cartas</div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<UnstableUnicornsGame />, document.getElementById('root'));
</script>
</body>
</html>
